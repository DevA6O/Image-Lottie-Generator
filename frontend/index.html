<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Images &amp; Animations</title>
  <script>
    // Sets the saved (or system) theme before the first paint, so the page does not flash.
    // The storage key must match THEME_STORAGE_KEY in app.js.
    (function () {
      let theme = null;
      try { theme = localStorage.getItem("theme"); } catch (error) {}
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Images &amp; Animations</h1>
    <nav id="filters" class="chips" aria-label="Categories"></nav>
    <button id="theme-toggle" class="theme-toggle" type="button"></button>
  </header>

  <main id="gallery"></main>

  <div id="lightbox" class="lightbox" hidden>
    <button class="close" id="close" aria-label="Close">&times;</button>
    <figure>
      <div id="stage" class="stage"></div>
      <figcaption>
        <span id="caption"></span>
        <a id="lightbox-download" class="lightbox-download">Download</a>
      </figcaption>
    </figure>
  </div>

  <script src="vendor/lottie.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
