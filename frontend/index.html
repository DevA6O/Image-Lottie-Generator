<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Images &amp; Animations</title>
  <script>
    // Sets the saved (or system) theme before the first paint, so the page does not flash.
    // The storage key must match THEME_STORAGE_KEY in app.js.
    (function () {
      let theme = null;
      try { theme = localStorage.getItem("theme"); } catch (error) {}
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Main navigation">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"/></svg>
        </span>
        <span class="brand-name">Assets<small>Images &amp; Animations</small></span>
      </div>

      <p class="nav-label">Menu</p>
      <nav id="category-nav" class="nav" aria-label="Categories"></nav>
    </aside>

    <div class="content">
      <header class="topbar">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <input id="search" type="search" placeholder="Search images and animations…" autocomplete="off" aria-label="Search">
          <kbd>/</kbd>
        </label>
        <button id="theme-toggle" class="icon-button" type="button"></button>
      </header>

      <main id="gallery">
        <div id="stats" class="stats"></div>
        <div id="sections"></div>
      </main>
    </div>
  </div>

  <div id="lightbox" class="lightbox" hidden>
    <button class="close" id="close" aria-label="Close">&times;</button>
    <button class="nav-arrow previous" id="previous" aria-label="Previous" title="Previous (left arrow)">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="nav-arrow next" id="next" aria-label="Next" title="Next (right arrow)">
      <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <figure>
      <div id="stage" class="stage"></div>
      <figcaption>
        <span id="caption"></span>
        <span id="position" class="position"></span>
        <a id="lightbox-download" class="lightbox-download">Download</a>
      </figcaption>
    </figure>
  </div>

  <script src="vendor/lottie.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
